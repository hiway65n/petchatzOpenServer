<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetChatz</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>PetChatz</h1>
    <p class="sub">Sign in to call a camera.</p>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </main>
  <script>
    var error = document.getElementById("login-error");
    if (location.search.indexOf("error=1") !== -1) {
      error.textContent = "Those credentials were not accepted.";
      error.className = "error";
    } else if (location.search.indexOf("error=2") !== -1) {
      error.textContent = "This account is turned off or has expired.";
      error.className = "error";
    }
    fetch("/api/session").then(function(r) { return r.json(); }).then(function(body) {
      if (body.user) location.href = "/calls";
    });
  </script>
</body>
</html>
